<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">RUMPS Storage Model</title>
  <desc id="desc">
    Diagram of the RUMPS storage model.
  </desc>

  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 14px;
      fill: currentColor;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .code {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        "Courier New", monospace;
    }
    .box {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      rx: 8;
      ry: 8;
    }
    .node {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
    }
    .edge {
      stroke: currentColor;
      stroke-width: 1.1;
      fill: none;
    }
    .attr-box {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      rx: 4;
      ry: 4;
    }
  </style>

  <rect class="box" x="16" y="16" width="868" height="488" />

  <text x="450" y="52" text-anchor="middle" class="title">
    RUMPS Storage Model
  </text>

  <text x="40" y="96">
    Each "global" (
    <tspan class="code">^NAME</tspan>
    ) is a sparse, sorted tree:
  </text>

  <circle class="node" cx="160" cy="160" r="11" />
  <text x="160" y="138" text-anchor="middle" class="code">^PATIENT</text>

  <circle class="node" cx="320" cy="210" r="10" />
  <text x="320" y="232" text-anchor="middle" class="code">1</text>

  <circle class="node" cx="320" cy="260" r="10" />
  <text x="320" y="282" text-anchor="middle" class="code">2</text>

  <circle class="node" cx="320" cy="310" r="10" />
  <text x="320" y="332" text-anchor="middle" class="code">10</text>

  <line class="edge" x1="169" y1="167" x2="310" y2="203" />
  <line class="edge" x1="171" y1="160" x2="310" y2="258" />
  <line class="edge" x1="169" y1="153" x2="310" y2="303" />

  <rect class="attr-box" x="430" y="190" width="160" height="24" />
  <text x="510" y="206" text-anchor="middle">
    <tspan class="code">"NAME"</tspan>
    <tspan xml:space="preserve"> → </tspan>
    <tspan class="code">"Alice"</tspan>
  </text>

  <rect class="attr-box" x="430" y="222" width="160" height="24" />
  <text x="510" y="238" text-anchor="middle">
    <tspan class="code">"AGE"</tspan>
    <tspan xml:space="preserve">  → </tspan>
    <tspan class="code">30</tspan>
  </text>

  <line class="edge" x1="330" y1="210" x2="430" y2="202" />
  <line class="edge" x1="330" y1="210" x2="430" y2="234" />

  <rect class="attr-box" x="430" y="240" width="160" height="24" />
  <text x="510" y="256" text-anchor="middle">
    <tspan class="code">"NAME"</tspan>
    <tspan xml:space="preserve"> → </tspan>
    <tspan class="code">"Bob"</tspan>
  </text>

  <rect class="attr-box" x="430" y="272" width="160" height="24" />
  <text x="510" y="288" text-anchor="middle">
    <tspan class="code">"AGE"</tspan>
    <tspan xml:space="preserve">  → </tspan>
    <tspan class="code">25</tspan>
  </text>

  <line class="edge" x1="330" y1="260" x2="430" y2="252" />
  <line class="edge" x1="330" y1="260" x2="430" y2="284" />

  <rect class="attr-box" x="430" y="290" width="160" height="24" />
  <text x="510" y="306" text-anchor="middle">
    <tspan class="code">"NAME"</tspan>
    <tspan xml:space="preserve"> → </tspan>
    <tspan class="code">"Carol"</tspan>
  </text>

  <rect class="attr-box" x="430" y="322" width="160" height="24" />
  <text x="510" y="338" text-anchor="middle">
    <tspan class="code">"ADDR"</tspan>
  </text>

  <line class="edge" x1="330" y1="310" x2="430" y2="302" />
  <line class="edge" x1="330" y1="310" x2="430" y2="326" />

  <rect class="attr-box" x="640" y="270" width="180" height="24" />
  <text x="730" y="286" text-anchor="middle">
    <tspan class="code">"CITY"</tspan>
    <tspan xml:space="preserve"> → </tspan>
    <tspan class="code">"NYC"</tspan>
  </text>

  <rect class="attr-box" x="640" y="310" width="180" height="24" />
  <text x="730" y="326" text-anchor="middle">
    <tspan class="code">"ZIP"</tspan>
    <tspan xml:space="preserve">  → </tspan>
    <tspan class="code">"10001"</tspan>
  </text>

  <line class="edge" x1="590" y1="334" x2="640" y2="282" />
  <line class="edge" x1="590" y1="334" x2="640" y2="322" />

  <text x="40" y="380">Keys are paths through the tree:</text>

  <text x="80" y="410">
    <tspan class="code">^PATIENT(1,"NAME")</tspan>
    <tspan xml:space="preserve">  →  </tspan>
    <tspan class="code">"Alice"</tspan>
    <tspan xml:space="preserve">    Key: </tspan>
    <tspan class="code">[1, "NAME"]</tspan>
  </text>

  <text x="80" y="438">
    <tspan class="code">^PATIENT(10,"ADDR","CITY")</tspan>
    <tspan xml:space="preserve"> →  </tspan>
    <tspan class="code">"NYC"</tspan>
    <tspan xml:space="preserve">      Key: </tspan>
    <tspan class="code">[10, "ADDR", "CITY"]</tspan>
  </text>

  <text x="80" y="466">
    <tspan class="code">^PATIENT(2)</tspan>
    <tspan xml:space="preserve">
      →  (no value, but has descendants)
    </tspan>
  </text>
</svg>

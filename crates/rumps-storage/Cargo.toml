[package]
name = "rumps-storage"
version = "0.0.1"
edition = "2021"

[dependencies]
rumps-types = { path = "../rumps-types" }
rumps-derive = { path = "../rumps-derive", optional = true }
async-trait = "0.1"
bincode = "1.3"
bitvec = "1.0"
crc32fast = "1.4"
futures = "0.3"
lru = "0.12"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Benchmark dependencies (only when bench feature is enabled)
criterion = { workspace = true, optional = true }
tempfile = { version = "3.14", optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1.0"
tempfile = "3.14"
tokio-test = "0.4"

[features]
default = ["derive"]
derive = ["rumps-derive"]
bench = ["criterion", "tempfile"]

[[bench]]
name = "database_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "orm_bench"
harness = false
required-features = ["bench", "derive"]

[lints.rust]
dead_code = "allow"

[lints.clippy]
obfuscated_if_else = "allow"
option_map_unit_fn = "allow"
type_complexity = "allow"
use_self = "warn"
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "rumps-storage"
version = "0.0.1"
edition = "2021"

[dependencies]
rumps-types = { path = "../rumps-types" }
bincode = "1.3"
bitvec = "1.0"
crc32fast = "1.4"
dashmap = "5"
smallvec = { workspace = true }
fs2 = "0.4"
futures = { workspace = true }
lz4_flex = "0.11"
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1.0"
tempfile = "3.14"
tokio-test = "0.4"

[features]
# Enable B-tree statistics tracking (adds lock contention on every write)
debug = []

[[bench]]
name = "database_bench"
harness = false

[lints]
workspace = true

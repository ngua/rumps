[package]
name = "rumps"
version = "0.0.1"
edition = "2021"

[dependencies]
rumps-types = { path = "../rumps-types" }
rumps-storage = { path = "../rumps-storage", default-features = false }
rumps-derive = { path = "../rumps-derive", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["derive"]
derive = ["rumps-derive", "rumps-storage/derive"]

[lints.clippy]
obfuscated_if_else = "allow"
option_map_unit_fn = "allow"
type_complexity = "allow"
use_self = "warn"
unwrap_used = "deny"
expect_used = "deny"

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 720"
  role="img"
  aria-labelledby="title desc"
  style="color: white; background:black"
>
  <title id="title">RUMPS Storage Model</title>
  <desc id="desc">
    Diagram of the RUMPS storage model, showing all keys as nodes in a sparse
    sorted tree, with separate terminal values.
  </desc>

  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 14px;
      fill: currentColor; /* now white */
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .code {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        "Courier New", monospace;
    }
    .box {
      fill: none;
      stroke: currentColor; /* white */
      stroke-width: 1;
      rx: 8;
      ry: 8;
    }
    .node {
      fill: none;
      stroke: currentColor; /* white */
      stroke-width: 1.3;
    }
    .edge {
      stroke: currentColor; /* white */
      stroke-width: 1.1;
      fill: none;
    }
  </style>

  <!-- Outer box -->
  <rect class="box" x="16" y="16" width="868" height="688" />

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" class="title">
    RUMPS Storage Model
  </text>

  <!-- Intro text -->
  <text x="40" y="96">
    Each "global" {
    <tspan class="code">^NAME</tspan>
    } is a sparse, sorted tree:
  </text>

  <!-- Root node -->
  <circle class="node" cx="160" cy="140" r="11" />
  <text x="160" y="120" text-anchor="middle" class="code">^PATIENT</text>

  <!-- ID nodes -->
  <circle class="node" cx="320" cy="220" r="10" />
  <text x="320" y="242" text-anchor="middle" class="code">1</text>

  <circle class="node" cx="320" cy="320" r="10" />
  <text x="320" y="342" text-anchor="middle" class="code">2</text>

  <circle class="node" cx="320" cy="420" r="10" />
  <text x="320" y="442" text-anchor="middle" class="code">10</text>

  <!-- Edges: root -> IDs -->
  <line class="edge" x1="171" y1="147" x2="310" y2="220" />
  <line class="edge" x1="171" y1="140" x2="310" y2="320" />
  <line class="edge" x1="169" y1="133" x2="310" y2="420" />

  <!-- PATIENT 1 keys -->
  <circle class="node" cx="460" cy="250" r="9" />
  <text x="460" y="234" text-anchor="middle" class="code">"NAME"</text>

  <circle class="node" cx="460" cy="290" r="9" />
  <text x="460" y="274" text-anchor="middle" class="code">"AGE"</text>

  <line class="edge" x1="330" y1="220" x2="451" y2="250" />
  <line class="edge" x1="330" y1="220" x2="451" y2="290" />

  <line class="edge" x1="469" y1="250" x2="525" y2="250" />
  <text x="540" y="254" class="code">"Alice"</text>

  <line class="edge" x1="469" y1="290" x2="525" y2="290" />
  <text x="540" y="294" class="code">30</text>

  <!-- PATIENT 2 keys -->
  <circle class="node" cx="460" cy="350" r="9" />
  <text x="460" y="334" text-anchor="middle" class="code">"NAME"</text>

  <circle class="node" cx="460" cy="390" r="9" />
  <text x="460" y="374" text-anchor="middle" class="code">"AGE"</text>

  <line class="edge" x1="330" y1="320" x2="451" y2="350" />
  <line class="edge" x1="330" y1="320" x2="451" y2="390" />

  <line class="edge" x1="469" y1="350" x2="525" y2="350" />
  <text x="540" y="354" class="code">"Bob"</text>

  <line class="edge" x1="469" y1="390" x2="525" y2="390" />
  <text x="540" y="394" class="code">25</text>

  <!-- PATIENT 10 keys -->
  <circle class="node" cx="460" cy="450" r="9" />
  <text x="460" y="434" text-anchor="middle" class="code">"NAME"</text>

  <circle class="node" cx="460" cy="490" r="9" />
  <text x="460" y="474" text-anchor="middle" class="code">"ADDR"</text>

  <line class="edge" x1="330" y1="420" x2="451" y2="450" />
  <line class="edge" x1="330" y1="420" x2="451" y2="490" />

  <line class="edge" x1="469" y1="450" x2="525" y2="450" />
  <text x="540" y="454" class="code">"Carol"</text>

  <!-- ADDR subkeys -->
  <circle class="node" cx="640" cy="540" r="9" />
  <text x="640" y="524" text-anchor="middle" class="code">"CITY"</text>

  <circle class="node" cx="640" cy="580" r="9" />
  <text x="640" y="564" text-anchor="middle" class="code">"ZIP"</text>

  <line class="edge" x1="469" y1="490" x2="631" y2="540" />
  <line class="edge" x1="469" y1="490" x2="631" y2="580" />

  <line class="edge" x1="649" y1="540" x2="705" y2="540" />
  <text x="720" y="544" class="code">"NYC"</text>

  <line class="edge" x1="649" y1="580" x2="705" y2="580" />
  <text x="720" y="584" class="code">"10001"</text>

  <!-- Keys section -->
  <text x="40" y="610">Keys are paths through the tree:</text>

  <text x="80" y="640">
    <tspan class="code">^PATIENT{ 1,"NAME" }</tspan>
    <tspan xml:space="preserve">  →  </tspan>
    <tspan class="code">"Alice"</tspan>
    <tspan xml:space="preserve">    Key: </tspan>
    <tspan class="code">[1, "NAME"]</tspan>
  </text>

  <text x="80" y="668">
    <tspan class="code">^PATIENT{ 10,"ADDR","CITY" }</tspan>
    <tspan xml:space="preserve"> →  </tspan>
    <tspan class="code">"NYC"</tspan>
    <tspan xml:space="preserve">      Key: </tspan>
    <tspan class="code">[10, "ADDR", "CITY"]</tspan>
  </text>

  <text x="80" y="696">
    <tspan class="code">^PATIENT{ 2 }</tspan>
    <tspan xml:space="preserve"> →  (no value, but has descendants) </tspan>
  </text>
</svg>

[package]
name = "rumps-storage"
version = "0.0.1"
edition = "2021"

[dependencies]
rumps-types = { path = "../rumps-types" }
rumps-derive = { path = "../rumps-derive", optional = true }
async-recursion = { workspace = true }
async-trait = "0.1"
bincode = "1.3"
bitvec = "1.0"
crc32fast = "1.4"
dashmap = "5"
smallvec = { workspace = true }
fs2 = "0.4"
futures = { workspace = true }
lru = "0.12"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1.0"
tempfile = "3.14"
tokio-test = "0.4"
trybuild = "1.0"

[features]
default = ["derive"]
derive = ["rumps-derive"]
# Enable B-tree statistics tracking (adds lock contention on every write)
debug = []

[[bench]]
name = "database_bench"
harness = false

[[bench]]
name = "orm_bench"
harness = false

[lints.rust]
dead_code = "allow"

[lints.clippy]
obfuscated_if_else = "allow"
option_map_unit_fn = "allow"
type_complexity = "allow"
use_self = "warn"
unwrap_used = "deny"
expect_used = "deny"
